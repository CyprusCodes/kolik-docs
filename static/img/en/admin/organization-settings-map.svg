<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 278" role="img" aria-labelledby="title description">
  <title id="title">Organization Settings tabs</title>
  <desc id="description">Document expiry, employees, and email configuration are separate tabs.</desc>
  <rect width="980" height="278" rx="24" fill="#eff3f8"/>
  <g font-family="Arial, sans-serif">
    <text x="40" y="47" font-size="25" font-weight="700" fill="#173a62">Organization Settings</text>
    <rect x="40" y="79" width="284" height="156" rx="16" fill="#fff" stroke="#cbd9e7" stroke-width="2"/>
    <rect x="348" y="79" width="284" height="156" rx="16" fill="#e6f3ec" stroke="#9acfb2" stroke-width="2"/>
    <rect x="656" y="79" width="284" height="156" rx="16" fill="#fff1e9" stroke="#edb894" stroke-width="2"/>
    <text x="59" y="120" font-size="18" font-weight="700" fill="#173a62">Document Expiry</text>
    <text x="59" y="154" font-size="14" fill="#4c6176">Notification timing and recipients</text>
    <text x="367" y="120" font-size="18" font-weight="700" fill="#176745">Employees</text>
    <text x="367" y="154" font-size="14" fill="#395e4c">Self-service, salary, photo</text>
    <text x="675" y="120" font-size="18" font-weight="700" fill="#8c4a2d">Email Configuration</text>
    <text x="675" y="154" font-size="14" fill="#8c4a2d">SMTP, logo, and test email</text>
  </g>
</svg>
