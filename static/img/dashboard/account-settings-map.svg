<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Hesabım sayfasındaki dört sekme</title>
  <desc id="desc">Profil simgesi ve Ayarlar bağlantısından Hesabım sayfasına gidilir. Genel, Banka Bilgileri, Bildirimler ve Şifre Değiştir sekmeleri bulunur.</desc>
  <rect width="1200" height="430" rx="24" fill="#f1f7fb"/>
  <rect x="31" y="31" width="1138" height="84" rx="18" fill="#143b59"/>
  <circle cx="73" cy="73" r="24" fill="#37c4b0"/>
  <circle cx="73" cy="65" r="8" fill="#143b59"/>
  <path d="M59 87c2-11 26-11 28 0" fill="#143b59"/>
  <text x="115" y="82" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#ffffff">Profil simgesi  →  Ayarlar  →  Hesabım</text>
  <text x="825" y="82" font-family="Arial,sans-serif" font-size="16" fill="#d8edf7">app.kolik.co/dashboard/account</text>
  <g font-family="Arial,sans-serif">
    <rect x="31" y="145" width="267" height="236" rx="18" fill="#ffffff" stroke="#cfe1eb" stroke-width="2"/>
    <rect x="31" y="145" width="267" height="12" rx="6" fill="#2aa99b"/>
    <circle cx="65" cy="194" r="20" fill="#dff7f0"/><text x="65" y="201" text-anchor="middle" font-size="17" font-weight="bold" fill="#117d6d">1</text>
    <text x="99" y="202" font-size="21" font-weight="bold" fill="#153b56">Genel</text>
    <text x="51" y="250" font-size="16" fill="#45667a">Fotoğraf · ad · doğum tarihi</text>
    <text x="51" y="282" font-size="16" fill="#45667a">Kişisel bilgiler</text>
    <text x="51" y="314" font-size="16" fill="#45667a">Acil durum kişileri</text>

    <rect x="321" y="145" width="267" height="236" rx="18" fill="#ffffff" stroke="#cfe1eb" stroke-width="2"/>
    <rect x="321" y="145" width="267" height="12" rx="6" fill="#4b9ed1"/>
    <circle cx="355" cy="194" r="20" fill="#e2f2fb"/><text x="355" y="201" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c78a5">2</text>
    <text x="389" y="202" font-size="21" font-weight="bold" fill="#153b56">Banka Bilgileri</text>
    <text x="341" y="250" font-size="16" fill="#45667a">Hesap ekle · düzenle</text>
    <text x="341" y="282" font-size="16" fill="#45667a">IBAN / hesap numarası</text>
    <text x="341" y="314" font-size="16" fill="#45667a">Aktif / pasif durum</text>

    <rect x="611" y="145" width="267" height="236" rx="18" fill="#ffffff" stroke="#cfe1eb" stroke-width="2"/>
    <rect x="611" y="145" width="267" height="12" rx="6" fill="#9a85d2"/>
    <circle cx="645" cy="194" r="20" fill="#eee9fa"/><text x="645" y="201" text-anchor="middle" font-size="17" font-weight="bold" fill="#7659b6">3</text>
    <text x="679" y="202" font-size="21" font-weight="bold" fill="#153b56">Bildirimler</text>
    <text x="631" y="250" font-size="16" fill="#45667a">İzin · destek · toplantı</text>
    <text x="631" y="282" font-size="16" fill="#45667a">Belge · zaman çizelgesi</text>
    <text x="631" y="314" font-size="16" fill="#45667a">Anahtarları seç ve kaydet</text>

    <rect x="901" y="145" width="267" height="236" rx="18" fill="#ffffff" stroke="#cfe1eb" stroke-width="2"/>
    <rect x="901" y="145" width="267" height="12" rx="6" fill="#e5a451"/>
    <circle cx="935" cy="194" r="20" fill="#fff1dd"/><text x="935" y="201" text-anchor="middle" font-size="17" font-weight="bold" fill="#ae762a">4</text>
    <text x="969" y="202" font-size="21" font-weight="bold" fill="#153b56">Şifre Değiştir</text>
    <text x="921" y="250" font-size="16" fill="#45667a">Mevcut şifre</text>
    <text x="921" y="282" font-size="16" fill="#45667a">Yeni şifre ve onay</text>
    <text x="921" y="314" font-size="16" fill="#45667a">Güvenli parola kuralları</text>
  </g>
  <text x="31" y="408" font-family="Arial,sans-serif" font-size="15" fill="#5f7989">Temsili şema · sekmeler kişisel hesabınıza aittir; bazı bilgiler seçili kuruluştaki çalışan kaydına bağlıdır.</text>
</svg>
