<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 310" role="img" aria-labelledby="title description">
  <title id="title">Politika ve izin türü kuralları</title>
  <desc id="description">İzin türü kataloğundan politikaya bağlanan bir türün hak ediş, birikim, devir ve kıdem kuralları ayrı düzenlenir.</desc>
  <rect width="980" height="310" rx="24" fill="#eff3f8"/>
  <g font-family="Arial, sans-serif">
    <text x="42" y="50" font-size="25" font-weight="700" fill="#173a62">Bir izin türünün hakları nerede belirlenir?</text>
    <rect x="42" y="82" width="254" height="142" rx="16" fill="#fff" stroke="#cbd9e7" stroke-width="2"/>
    <text x="63" y="124" font-size="19" font-weight="700" fill="#173a62">İzin türü kataloğu</text>
    <text x="63" y="155" font-size="15" fill="#4c6176">Ad, not zorunluluğu,</text>
    <text x="63" y="180" font-size="15" fill="#4c6176">saatlik talep seçeneği</text>
    <path d="M305 153h61m-14-11 14 11-14 11" fill="none" stroke="#ef8050" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="377" y="82" width="225" height="142" rx="16" fill="#fff" stroke="#cbd9e7" stroke-width="2"/>
    <text x="399" y="124" font-size="19" font-weight="700" fill="#173a62">İzin politikası</text>
    <text x="399" y="155" font-size="15" fill="#4c6176">İzin türlerini bağla</text>
    <text x="399" y="180" font-size="15" fill="#4c6176">→ Kuralları düzenle</text>
    <path d="M611 153h48m-14-11 14 11-14 11" fill="none" stroke="#ef8050" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="670" y="82" width="268" height="142" rx="16" fill="#e6f3ec" stroke="#9acfb2" stroke-width="2"/>
    <text x="693" y="124" font-size="19" font-weight="700" fill="#176745">Türün politika kuralları</text>
    <text x="693" y="155" font-size="15" fill="#395e4c">Hak ediş · Birikim · Devir</text>
    <text x="693" y="180" font-size="15" fill="#395e4c">Kıdem · Genel</text>
    <rect x="42" y="247" width="896" height="39" rx="10" fill="#fff1e9"/>
    <text x="60" y="272" font-size="15" fill="#8c4a2d">Saatlik talep açık olması, çalışana otomatik gün veya saat bakiyesi yüklemez.</text>
  </g>
</svg>
