<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title description">
  <title id="title">Yeni İzin Türü Ekle formu</title>
  <desc id="description">İzin türü adı, Not Gerekli ve Saatlik Talebe İzin Ver alanları işaretlenmiştir.</desc>
  <rect width="960" height="570" rx="24" fill="#eff3f8"/>
  <rect x="140" y="32" width="680" height="504" rx="18" fill="#fff" stroke="#d6e0ea" stroke-width="2"/>
  <rect x="140" y="32" width="680" height="72" rx="18" fill="#173a62"/>
  <rect x="140" y="86" width="680" height="18" fill="#173a62"/>
  <text x="178" y="78" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#fff">Yeni İzin Türü Ekle</text>

  <g font-family="Arial, sans-serif" fill="#20364d">
    <text x="178" y="140" font-size="15" font-weight="700">İzin Türü Adı *</text>
    <rect x="178" y="154" width="604" height="51" rx="8" fill="#fff" stroke="#aebdcc" stroke-width="2"/>
    <text x="195" y="186" font-size="17">Örn. Mazeret İzni</text>
    <text x="178" y="224" font-size="13" fill="#64758a">İzin türü için açıklayıcı bir ad girin.</text>

    <rect x="178" y="256" width="25" height="25" rx="4" fill="#fff" stroke="#7d94a9" stroke-width="2"/>
    <text x="218" y="275" font-size="17" font-weight="700">Not Gerekli</text>
    <text x="218" y="301" font-size="13" fill="#64758a">İşaretlenirse çalışan talep sırasında not girmelidir.</text>

    <rect x="178" y="334" width="25" height="25" rx="4" fill="#1976d2" stroke="#1976d2" stroke-width="2"/>
    <path d="m184 346 5 5 9-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="218" y="353" font-size="17" font-weight="700">Saatlik Talebe İzin Ver</text>
    <text x="218" y="379" font-size="13" fill="#64758a">Açık: aynı gün için saat seçilir. Kapalı: tam gün talep edilir.</text>

    <line x1="140" y1="430" x2="820" y2="430" stroke="#e2e8ef"/>
    <rect x="586" y="457" width="88" height="47" rx="8" fill="#f0f4f8"/>
    <text x="606" y="487" font-size="16" font-weight="700">İptal</text>
    <rect x="692" y="457" width="90" height="47" rx="8" fill="#1976d2"/>
    <text x="719" y="487" font-size="16" font-weight="700" fill="#fff">Ekle</text>
  </g>
  <rect x="164" y="323" width="615" height="72" rx="12" fill="none" stroke="#ed7844" stroke-width="3" stroke-dasharray="7 5"/>
  <path d="M780 362h51" stroke="#ed7844" stroke-width="3"/>
  <rect x="831" y="316" width="107" height="33" rx="8" fill="#fff1e9"/>
  <text x="844" y="338" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#9a4f2b">Saatlik ayar</text>
</svg>
